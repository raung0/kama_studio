[workspace]
members = ["crates/app", "crates/editor-core", "crates/ui", "crates/ui-macros", "crates/renderer", "crates/plugin"]
default-members = ["crates/app"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
