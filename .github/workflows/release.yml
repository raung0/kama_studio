name: Release

on:
  push:
    tags:
      - "*-alpha.*"
      - "*-beta.*"
      - "*-rc.*"
      - "*-stable.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.89.0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^[0-9]{4}\.[0-9]{2}-(alpha|beta|rc|stable)\.[0-9]+$ ]] || {
            echo "Unexpected release tag: ${RELEASE_TAG}" >&2
            exit 1
          }

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdbus-1-dev \
            libswscale-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Build
        shell: bash
        run: cargo build --release --package kama

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/kama dist/package/kama
          tar -C dist/package -czf "dist/kama-${RELEASE_TAG}-linux-x86_64.tar.gz" .
          rm -rf dist/package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kama-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^\d{4}\.\d{2}-(alpha|beta|rc|stable)\.\d+$') {
            throw "Unexpected release tag: $env:RELEASE_TAG"
          }

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup target add --toolchain $env:RUST_VERSION wasm32-unknown-unknown
          rustup default $env:RUST_VERSION

      - name: Install pinned prebuilt FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '9.0.1'
          $expectedSha256 = 'CB4D5E8DB6A3353BFFDB2100D3EB4B76733457FA443215E236F57C99F9FFDCA4'
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$version-full_build-shared.7z"
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-full_build-shared.7z"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg checksum mismatch. Expected $expectedSha256, got $actualSha256"
          }

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip not found at $sevenZip"
          }
          & $sevenZip x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed with exit code $LASTEXITCODE"
          }

          $ffmpegRoot = Join-Path $extract "ffmpeg-$version-full_build-shared"
          if (-not (Test-Path (Join-Path $ffmpegRoot 'include/libavcodec/avcodec.h'))) {
            throw "FFmpeg headers not found under $ffmpegRoot"
          }
          if (-not (Test-Path (Join-Path $ffmpegRoot 'lib'))) {
            throw "FFmpeg import libraries not found under $ffmpegRoot"
          }
          if (-not (Test-Path (Join-Path $ffmpegRoot 'bin'))) {
            throw "FFmpeg runtime DLLs not found under $ffmpegRoot"
          }

          "FFMPEG_DIR=$ffmpegRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KAMA_FFMPEG_BIN=$(Join-Path $ffmpegRoot 'bin')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using pinned FFmpeg $version from $ffmpegRoot"

      - name: Build
        shell: pwsh
        run: cargo build --release --package kama

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'dist/package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'target/release/kama.exe' "$package/kama.exe"

          Get-ChildItem -Path $env:KAMA_FFMPEG_BIN -Filter '*.dll' | Copy-Item -Destination $package

          $archive = "dist/kama-$env:RELEASE_TAG-windows-x86_64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -CompressionLevel Optimal
          Remove-Item -Recurse -Force $package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kama-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  build-macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate architecture and release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "Expected an arm64 runner, got $(uname -m)" >&2
            exit 1
          }
          [[ "${RELEASE_TAG}" =~ ^[0-9]{4}\.[0-9]{2}-(alpha|beta|rc|stable)\.[0-9]+$ ]] || {
            echo "Unexpected release tag: ${RELEASE_TAG}" >&2
            exit 1
          }

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(python3 - <<'PY'
          from pathlib import Path
          import re

          def version(path: Path):
              match = re.search(r"Xcode_(26(?:\.\d+)*)\.app$", path.name)
              return tuple(int(part) for part in match.group(1).split('.')) if match else ()

          apps = [p for p in Path('/Applications').glob('Xcode_26*.app') if version(p)]
          if not apps:
              raise SystemExit('No Xcode 26 installation found')
          print(max(apps, key=version))
          PY
          )"
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version

      - name: Install Rust and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          brew install ffmpeg pkg-config
          cargo install cargo-bundle --locked

          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          echo "PKG_CONFIG_PATH=${ffmpeg_prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
          pkg-config --modversion libavutil
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libswscale

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          # Keep release CI independent of Xcode's AssetCatalogAgent/actool.
          # The custom Icon Composer pipeline is useful for local packaging, but
          # has proven unstable on hosted runners. cargo-bundle already creates
          # a valid .app; runtime dylibs are added and the bundle is re-signed in
          # the next step.
          MACOSX_DEPLOYMENT_TARGET=15.0 \
            cargo bundle --release --format osx --package kama
          test -d target/release/bundle/osx/Kama.app

      - name: Bundle Homebrew runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/bundle-macos-dylibs.sh target/release/bundle/osx/Kama.app

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/osx/Kama.app \
            "dist/kama-${RELEASE_TAG}-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kama-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            release create "$RELEASE_TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --title "$RELEASE_TAG"
            --generate-notes
            --verify-tag
          )

          if [[ "$RELEASE_TAG" != *-stable.* ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
